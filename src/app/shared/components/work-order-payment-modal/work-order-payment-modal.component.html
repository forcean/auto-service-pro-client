<div
  *ngIf="isOpen"
  class="fixed inset-0 z-[9999] flex items-end bg-slate-950/50 p-0 backdrop-blur-sm sm:items-center sm:justify-center sm:p-4"
  role="presentation"
  (click)="onBackdropClick()"
>
  <section
    class="flex max-h-[92vh] w-full max-w-xl flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:max-h-[calc(100vh-2rem)] sm:rounded-3xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="work-order-payment-modal-title"
    (click)="onModalContentClick($event)"
  >
    <div class="flex items-start justify-between gap-4 border-b border-slate-100 bg-gradient-to-r from-sky-50 to-white px-5 py-5 sm:px-6">
      <div class="flex min-w-0 items-start gap-3">
        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-sky-700 text-xl font-bold text-white shadow-sm">฿</div>
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-sky-700">Customer payment credit</p>
          <h3 id="work-order-payment-modal-title" class="mt-1 text-xl font-bold text-slate-950">บันทึกรับชำระ</h3>
          <p class="mt-1 text-sm leading-5 text-slate-500">บันทึกเป็นเครดิตของใบงาน และหักจาก Invoice อัตโนมัติภายหลัง</p>
        </div>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        [disabled]="isSubmitting"
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-2xl leading-none text-slate-400 transition hover:bg-white hover:text-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
        aria-label="ปิด"
      >
        ×
      </button>
    </div>

    <div class="flex-1 overflow-y-auto px-5 py-5 sm:px-6">
      <div class="mb-5 rounded-2xl border border-sky-100 bg-sky-50/70 p-3.5 text-sm text-sky-900">
        <div class="flex items-center justify-between gap-3">
          <span class="font-semibold">เครดิตที่ยังรอหัก Invoice</span>
          <span class="text-base font-bold">฿{{ availableCredit | number:'1.2-2' }}</span>
        </div>
        <p class="mt-1 text-xs leading-5 text-sky-700">เงินรับชำระรายการนี้ยังไม่ใช่ใบกำกับ และสามารถบันทึกได้ทั้งก่อนเริ่มงานหรือระหว่างซ่อม</p>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block sm:col-span-2">
          <span class="text-sm font-semibold text-slate-800">จำนวนเงินที่รับ *</span>
          <div class="relative mt-1.5">
            <span class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-lg font-bold text-slate-400">฿</span>
            <input
              [(ngModel)]="form.amount"
              type="number"
              min="0.01"
              step="0.01"
              inputmode="decimal"
              placeholder="0.00"
              class="min-h-[52px] w-full rounded-xl border border-slate-200 bg-slate-50/60 py-3 pl-9 pr-4 text-lg font-bold text-slate-900 outline-none transition placeholder:font-normal placeholder:text-slate-400 focus:border-sky-500 focus:bg-white focus:ring-4 focus:ring-sky-100"
            />
          </div>
          <p *ngIf="validationMessage" class="mt-1.5 text-xs font-medium text-rose-600">{{ validationMessage }}</p>
        </label>

        <label class="block">
          <span class="text-sm font-semibold text-slate-800">ประเภทการรับชำระ *</span>
          <custom-select
            #paymentTypeSelect
            [(ngModel)]="form.type"
            dropdownName="work-order-payment-type"
            class="mt-1.5 block w-full"
            [isDropdownOpen]="isPaymentTypeDropdownOpen"
            (toggle)="syncPaymentDropdown('type', paymentTypeSelect.isDropdownOpen)"
            (clickOutside)="closePaymentDropdowns()"
          >
            <custom-option *ngFor="let type of paymentTypes" [value]="type">{{ paymentTypeLabel(type) }}</custom-option>
          </custom-select>
          <p class="mt-1.5 text-xs leading-5 text-slate-500">{{ paymentTypeHint(form.type) }}</p>
        </label>

        <label class="block">
          <span class="text-sm font-semibold text-slate-800">ช่องทางชำระ *</span>
          <custom-select
            #paymentMethodSelect
            [(ngModel)]="form.method"
            dropdownName="work-order-payment-method"
            class="mt-1.5 block w-full"
            [isDropdownOpen]="isPaymentMethodDropdownOpen"
            (toggle)="syncPaymentDropdown('method', paymentMethodSelect.isDropdownOpen)"
            (clickOutside)="closePaymentDropdowns()"
          >
            <custom-option *ngFor="let method of paymentMethods" [value]="method">{{ paymentMethodLabel(method) }}</custom-option>
          </custom-select>
          <p class="mt-1.5 text-xs leading-5 text-slate-500">เลือกตามหลักฐานการรับเงินของร้าน</p>
        </label>

        <label class="block sm:col-span-2">
          <span class="text-sm font-semibold text-slate-800">เลขอ้างอิง <span class="font-normal text-slate-400">(ถ้ามี)</span></span>
          <input
            [(ngModel)]="form.reference"
            autocomplete="off"
            placeholder="เช่น เลขสลิป, เลขรายการ หรือ approval code"
            class="mt-1.5 min-h-12 w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-2.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:bg-white focus:ring-4 focus:ring-sky-100"
          />
        </label>

        <label class="block sm:col-span-2">
          <span class="text-sm font-semibold text-slate-800">หมายเหตุ <span class="font-normal text-slate-400">(ถ้ามี)</span></span>
          <textarea
            [(ngModel)]="form.note"
            rows="3"
            placeholder="ระบุรายละเอียดเพิ่มเติมสำหรับทีมบัญชีหรือทีมบริการ"
            class="mt-1.5 w-full resize-y rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-2.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:bg-white focus:ring-4 focus:ring-sky-100"
          ></textarea>
        </label>
      </div>
    </div>

    <div class="flex flex-col-reverse gap-2 border-t border-slate-100 bg-slate-50/70 px-5 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <p class="text-xs leading-5 text-slate-500">ระบบจะออกเลขที่ใบรับเงินหลังบันทึกสำเร็จ</p>
      <div class="flex flex-col-reverse gap-2 sm:flex-row">
        <button type="button" (click)="close.emit()" [disabled]="isSubmitting" class="min-h-11 rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-600 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50">ยกเลิก</button>
        <button type="button" (click)="onSubmit()" [disabled]="isSubmitting" class="min-h-11 rounded-xl bg-sky-700 px-5 py-2 text-sm font-bold text-white transition hover:bg-sky-800 disabled:cursor-not-allowed disabled:opacity-50">{{ isSubmitting ? 'กำลังบันทึก…' : 'ยืนยันรับชำระ' }}</button>
      </div>
    </div>
  </section>
</div>
