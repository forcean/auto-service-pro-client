<div
  class="product-card"
  [ngClass]="product.status"
  (click)="onClick()">

  <div class="product-image">

    <img
      *ngIf="primaryImageUrl; else noImage"
      [src]="primaryImageUrl"
      alt="product image"
      class="image" />

    <ng-template #noImage>
      <div class="no-image">
        ไม่มีรูปภาพ
      </div>
    </ng-template>

    <span
      *ngIf="statusLabel"
      class="status-badge"
      [ngClass]="badgeClass">
      {{ statusText }}
    </span>

  </div>

  <div class="product-content">

    <h3 class="product-name">
      {{ product.name }}
    </h3>

    <div class="product-sku">
      SKU: {{ product.code }}
    </div>

    <div class="product-meta">
      <span>{{ product.brandName }}</span>
      <span class="divider-dot"></span>
      <span>{{ product.categoryName }}</span>
    </div>

    <div
      *ngIf="vehicleNames?.length"
      class="product-vehicles">
      ใช้กับ: {{ vehicleNames }}
    </div>

    <div
      *ngIf="hasPrice"
      class="price-section">

      <div *ngIf="product.prices?.retail" class="price retail">
        ฿ {{ product.prices?.retail | number:'1.0-2' }}
      </div>

      <div *ngIf="product.prices?.wholesale" class="price wholesale">
        ราคาส่ง ฿ {{ product.prices?.wholesale | number:'1.0-2' }}
      </div>

    </div>

  </div>

</div>
