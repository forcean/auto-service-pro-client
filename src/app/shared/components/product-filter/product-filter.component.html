<form
  [formGroup]="form"
  class="filter-card">

  <!-- HEADER -->
  <div class="filter-header">
    <div>
      <h3 class="filter-title">
        ค้นหาอะไหล่
      </h3>
      <p class="filter-subtitle">
        กรองสินค้าในคลัง
      </p>
    </div>

    <button
      type="button"
      class="filter-reset"
      [disabled]="loading"
      (click)="reset()">
      ล้าง
    </button>
  </div>

  <!-- SEARCH -->
  <div class="filter-group">
    <label class="filter-label">
      ค้นหา
    </label>
    <div class="input-wrapper">
      <input
        type="text"
        class="form-input-custom"
        placeholder="SKU / ชื่อสินค้า"
        [disabled]="loading"
        formControlName="search" />
    </div>
  </div>

  <!-- CATEGORY -->
  <div class="filter-group">
    <label class="filter-label">
      หมวดหมู่
    </label>
    <app-custom-select-category
      formControlName="categoryId"
      [categories]="categories"
      [isDisabled]="loading"
      placeholder="เลือกหมวดหมู่">
    </app-custom-select-category>
  </div>

  <!-- BRAND -->
  <div class="filter-group">
    <label class="filter-label">
      แบรนด์
    </label>
    <custom-select
      formControlName="brandId"
      [isDisabled]="loading"
      placeholder="เลือกแบรนด์">
      <app-custom-brand-option
        *ngFor="let brand of brands"
        [brand]="brand">
      </app-custom-brand-option>
    </custom-select>
  </div>

  <!-- STOCK -->
  <div class="stock-wrapper">
    <label class="stock-check">
      <input
        type="checkbox"
        formControlName="inStock"
        [disabled]="loading"
        class="stock-checkbox" />
      <span>แสดงเฉพาะสินค้าที่เปิดใช้งานสต็อก</span>
    </label>
  </div>

</form>
