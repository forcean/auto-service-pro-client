<form
  [formGroup]="form"
  class="filter-card">

  <!-- HEADER -->
  <div class="filter-header">
    <div>
      <h3 class="filter-title">
        ค้นหาอะไหล่
      </h3>
      <p class="filter-subtitle">
        กรองสินค้าในคลัง
      </p>
    </div>

    <button
      type="button"
      class="filter-reset"
      (click)="reset()">
      ล้าง
    </button>
  </div>

  <!-- SEARCH -->
  <div class="filter-group">
    <label class="filter-label">
      ค้นหา
    </label>
    <div class="input-wrapper">
      <input
        type="text"
        class="form-input-custom"
        placeholder="SKU / ชื่อสินค้า"
        formControlName="search" />
    </div>
  </div>

  <!-- CATEGORY -->
  <div class="filter-group">
    <label class="filter-label">
      หมวดหมู่
    </label>
    <app-custom-select-category
      formControlName="categoryId"
      [categories]="categories"
      placeholder="เลือกหมวดหมู่">
    </app-custom-select-category>
  </div>

  <!-- BRAND -->
  <div class="filter-group">
    <label class="filter-label">
      แบรนด์
    </label>
    <custom-select
      formControlName="brandId"
      placeholder="เลือกแบรนด์">
      <app-custom-brand-option
        *ngFor="let brand of brands"
        [brand]="brand">
      </app-custom-brand-option>
    </custom-select>
  </div>

  <hr class="divider" />

  <!-- VEHICLE SECTION -->
  <div class="vehicle-section">
    <h4 class="vehicle-title">
      รถที่รองรับ
    </h4>

    <div class="vehicle-grid">
      <select class="form-input-custom" formControlName="vehicleBrandId">
        <option [ngValue]="null">ยี่ห้อรถ</option>
      </select>

      <select class="form-input-custom" formControlName="vehicleModelId">
        <option [ngValue]="null">รุ่นรถ</option>
      </select>

      <select class="form-input-custom" formControlName="year">
        <option [ngValue]="null">ปี</option>
      </select>

      <select class="form-input-custom" formControlName="engine">
        <option [ngValue]="null">เครื่องยนต์</option>
      </select>
    </div>
  </div>

  <!-- STOCK -->
  <div class="stock-wrapper">
    <label class="stock-check">
      <input
        type="checkbox"
        formControlName="inStock"
        class="stock-checkbox" />
      <span>แสดงเฉพาะสินค้าที่มีในสต็อก</span>
    </label>
  </div>

</form>
