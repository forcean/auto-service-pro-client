<form [formGroup]="searchForm" (ngSubmit)="onSubmit()">
  <div class="search-card">
    <!-- ================= Mobile Toolbar ================= -->

    <div class="mobile-toolbar">
      <div class="search-input flex-1">
        <input
          type="text"
          formControlName="keyword"
          placeholder="ค้นหา SKU, ชื่อสินค้า หรือ Reference"
        />

        <lucide-icon name="search" class="search-icon"> </lucide-icon>
      </div>

      <button type="button" class="btn-filter" (click)="toggleFilter()">
        <lucide-icon
          [name]="isMobileFilterOpen ? 'chevron-up' : 'sliders-horizontal'"
        >
        </lucide-icon>
      </button>
    </div>

    <!-- ================= Search ================= -->

    <div class="search-grid" [class.mobile-open]="isMobileFilterOpen">
      <!-- Keyword -->

      <div class="field keyword desktop-keyword">
        <label>ค้นหา</label>

        <div class="search-input">
          <input
            type="text"
            formControlName="keyword"
            placeholder="ค้นหา SKU, ชื่อสินค้า, เลขอ้างอิง..."
          />

          <lucide-icon name="search" class="search-icon"> </lucide-icon>
        </div>
      </div>

      <!-- Movement -->

      <div class="field">
        <label>ประเภทการเคลื่อนไหว</label>

        <custom-select formControlName="movementType">
          <custom-option value="">ทั้งหมด</custom-option>
          <custom-option value="RECEIVE">รับเข้า</custom-option>
          <custom-option value="ISSUE">เบิกออก</custom-option>
          <custom-option value="RETURN">คืนสินค้า</custom-option>
          <custom-option value="ADJUST">ปรับสต๊อก</custom-option>
          <custom-option value="RESERVE">สำรอง</custom-option>
          <custom-option value="RELEASE">ปลดสำรอง</custom-option>
        </custom-select>
      </div>

      <!-- Direction -->

      <div class="field">
        <label>ทิศทาง</label>

        <custom-select formControlName="direction">
          <custom-option value="">ทั้งหมด</custom-option>
          <custom-option value="IN">IN</custom-option>
          <custom-option value="OUT">OUT</custom-option>
        </custom-select>
      </div>

      <!-- SKU -->

      <div class="field">
        <label>สินค้า / SKU</label>

        <input
          class="form-control"
          formControlName="sku"
          placeholder="SKU หรือชื่อสินค้า"
        />
      </div>

      <!-- Warehouse -->

      <div class="field">
        <label>คลังสินค้า</label>

        <custom-select formControlName="warehouseId">
          <custom-option value="">ทั้งหมด</custom-option>
        </custom-select>
      </div>

      <!-- Start -->

      <div class="field">
        <label>วันที่เริ่มต้น</label>

        <input type="date" class="form-control" formControlName="startDate" />
      </div>

      <!-- End -->

      <div class="field">
        <label>วันที่สิ้นสุด</label>

        <input type="date" class="form-control" formControlName="endDate" />
      </div>

      <!-- Reference -->

      <div class="field reference">
        <label>Reference</label>

        <input
          class="form-control"
          formControlName="referenceId"
          placeholder="เลขเอกสาร / Job / PO"
        />
      </div>

      <!-- Created By -->

      <div class="field">
        <label>บันทึกโดย</label>

        <custom-select formControlName="createdBy">
          <custom-option value="">ทั้งหมด</custom-option>
        </custom-select>
      </div>

      <!-- Button -->

      <div class="button-group">
        <button type="button" class="btn-reset" (click)="onReset()">
          <lucide-icon name="rotate-ccw" size="18"> </lucide-icon>

          <span>ล้างตัวกรอง</span>
        </button>

        <button type="submit" class="btn-search">
          <lucide-icon name="search" size="18"> </lucide-icon>

          <span>ค้นหา</span>
        </button>
      </div>
    </div>
  </div>
</form>
