<form [formGroup]="searchForm" (ngSubmit)="onSubmit()">

    <div class="search-card">

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-5">

            <!-- Keyword -->
            <div class="xl:col-span-2">
                <label>ค้นหา</label>

                <div class="search-input">

                    <input type="text" placeholder="ค้นหา SKU, ชื่อสินค้า, เลขอ้างอิง..." formControlName="keyword">

                    <i class="fa-solid fa-magnifying-glass"></i>

                </div>
            </div>

            <!-- Movement -->
            <>

                <label>ประเภทการเคลื่อนไหว</label>

                <custom-select formControlName="movementType" placeholder="เลือกการเรียงลำดับ">

                    <custom-option value="">ทั้งหมด</custom-option>
                    <custom-option value="RECEIVE">รับเข้า</custom-option>
                    <custom-option value="ISSUE">เบิกออก</custom-option>
                    <custom-option value="RETURN">คืนสินค้า</custom-option>
                    <custom-option value="ADJUST">ปรับสต๊อก</custom-option>
                    <custom-option value="RESERVE">สำรอง</custom-option>
                    <custom-option value="RELEASE">ปลดสำรอง</custom-option>

                </custom-select>

                <!-- Direction -->

                <div>

                    <label>ทิศทาง</label>

                    <custom-select formControlName="direction">
                        <custom-option value="">ทั้งหมด</custom-option>
                        <custom-option value="IN">IN</custom-option>
                        <custom-option value="OUT">OUT</custom-option>
                    </custom-select>

                </div>

                <!-- SKU -->

                <div>

                    <label>สินค้า / SKU</label>

                    <!-- <ng-select [items]="products" bindLabel="name" bindValue="sku" formControlName="sku">
                    </ng-select> -->

                </div>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-5 mt-5">

                <!-- Start -->

                <div>

                    <label>วันที่เริ่มต้น</label>

                    <input type="date" class="form-control" formControlName="startDate">

                </div>

                <!-- End -->

                <div>

                    <label>วันที่สิ้นสุด</label>

                    <input type="date" class="form-control" formControlName="endDate">

                </div>

                <!-- Reference -->

                <div class="xl:col-span-2">

                    <label>อ้างอิง (Reference)</label>

                    <input class="form-control" placeholder="กรอกเลขเอกสาร / งาน / อื่น ๆ" formControlName="reference">

                </div>

                <!-- CreatedBy -->

                <div>

                    <label>บันทึกโดย</label>

                    <!-- <ng-select [items]="users" bindLabel="name" bindValue="id" formControlName="createdBy">
                    </ng-select> -->

                </div>

            </div>

            <div class="flex justify-end gap-3 mt-6">

                <button type="button" class="btn-reset" (click)="onReset()">

                    ล้างตัวกรอง

                </button>

                <button type="submit" class="btn-search">

                    ค้นหา

                </button>

            </div>

        </div>

</form>
