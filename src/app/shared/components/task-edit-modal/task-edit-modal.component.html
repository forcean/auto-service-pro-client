<div
  *ngIf="isOpen && task"
  class="fixed inset-0 z-[9999] flex items-center justify-center overflow-hidden bg-slate-900/50 p-4 backdrop-blur-sm"
  role="presentation"
  (click)="onBackdropClick()"
>
  <div
    class="flex max-h-[85vh] w-full max-w-4xl flex-col overflow-hidden rounded-3xl border border-slate-100 bg-white text-slate-800 shadow-2xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="task-edit-modal-title"
    (click)="$event.stopPropagation()"
  >
    <div class="flex flex-shrink-0 items-center justify-between border-b border-slate-100 bg-slate-50 px-6 py-4">
      <div>
        <p class="text-xs font-bold uppercase tracking-wider text-indigo-600">Task editor</p>
        <h3 id="task-edit-modal-title" class="mt-1 text-lg font-bold text-slate-900">แก้ไขรายละเอียด Task</h3>
        <p class="mt-1 font-mono text-xs text-slate-400">{{ task.taskNo }}</p>
      </div>
      <button type="button" (click)="close.emit()" [disabled]="isSubmitting" class="rounded-xl p-2 text-xl leading-none text-slate-400 transition-colors hover:bg-slate-200/60 hover:text-slate-700 disabled:opacity-40" aria-label="ปิดหน้าต่าง">×</button>
    </div>

    <div class="modal-scroll flex-1 space-y-6 overflow-y-auto p-6">
      <section class="space-y-4 rounded-2xl border border-slate-100 bg-slate-50/70 p-4">
        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500">ข้อมูลพื้นฐาน</h4>
        <div>
          <label class="mb-1 block text-sm font-semibold text-slate-700">ชื่องาน *</label>
          <input [(ngModel)]="form.title" class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-semibold text-slate-700">รายละเอียดงาน</label>
          <textarea [(ngModel)]="form.description" rows="3" class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"></textarea>
        </div>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <label class="text-sm font-semibold text-slate-700">Priority<select [(ngModel)]="form.priority" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"><option *ngFor="let priority of priorities" [value]="priority">{{ priority }}</option></select></label>
          <label class="text-sm font-semibold text-slate-700">ช่างผู้รับผิดชอบ <span class="font-normal text-slate-400">(เลือกได้หลายคน)</span><select multiple [(ngModel)]="mechanicIds" size="4" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"><option *ngFor="let mechanic of mechanics" [value]="mechanic.id">{{ mechanic.firstname || mechanic.publicId }} {{ mechanic.lastname || '' }} · {{ mechanic.publicId }}</option></select></label>
        </div>
      </section>

      <section class="space-y-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <h4 class="border-b border-slate-100 pb-3 text-xs font-bold uppercase tracking-wider text-slate-500">เวลาและความคืบหน้า</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <label class="text-sm font-semibold text-slate-700">เวลาประเมิน (นาที)<input [(ngModel)]="form.estimateMinute" type="number" min="0" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" /></label>
          <label class="text-sm font-semibold text-slate-700">เวลาที่ใช้จริง (นาที)<input [(ngModel)]="form.actualMinute" type="number" min="0" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" /></label>
          <label class="text-sm font-semibold text-slate-700">กำหนดเริ่มงาน<input [(ngModel)]="form.plannedStartDate" type="datetime-local" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" /></label>
          <label class="text-sm font-semibold text-slate-700">กำหนดเสร็จงาน<input [(ngModel)]="form.plannedFinishDate" type="datetime-local" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" /></label>
        </div>
        <div>
          <div class="flex items-center justify-between"><label class="text-sm font-semibold text-slate-700">ความคืบหน้า</label><span class="rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-bold text-indigo-700">{{ form.progress || 0 }}%</span></div>
          <input [(ngModel)]="form.progress" type="range" min="0" max="100" class="mt-3 w-full accent-indigo-600" />
          <input [(ngModel)]="form.progress" type="number" min="0" max="100" class="mt-2 w-24 rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
        </div>
      </section>

      <section>
        <label class="mb-1 block text-sm font-semibold text-slate-700">หมายเหตุภายใน</label>
        <textarea [(ngModel)]="form.remark" rows="3" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"></textarea>
      </section>
    </div>

    <div class="flex flex-shrink-0 justify-end gap-3 border-t border-slate-100 bg-white px-6 py-4">
      <button type="button" (click)="close.emit()" [disabled]="isSubmitting" class="rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50 disabled:opacity-50">ยกเลิก</button>
      <button type="button" (click)="onSave()" [disabled]="isSubmitting || !form.title?.trim()" class="rounded-xl bg-[#374870] px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-[#2d3b5e] disabled:cursor-not-allowed disabled:opacity-50">{{ isSubmitting ? 'กำลังบันทึก…' : 'บันทึกการแก้ไข' }}</button>
    </div>
  </div>
</div>
