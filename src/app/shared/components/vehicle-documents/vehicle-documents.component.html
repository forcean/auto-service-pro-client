<div class="space-y-6">
  <!-- ================= Header ================= -->

  <div
    class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between"
  >
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Documents</h2>

      <p class="mt-1 text-sm text-slate-500">
        Manage invoices, quotations, warranty cards and vehicle documents.
      </p>
    </div>

    <button
      (click)="onUpload()"
      class="rounded-xl bg-[#88C273] px-5 py-2.5 font-medium text-white transition hover:bg-[#79b464]"
    >
      <i class="fa-solid fa-upload mr-2"></i>

      Upload Document
    </button>
  </div>

  <!-- ================= Search & Filter ================= -->

  <div
    class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between"
  >
    <!-- Search -->

    <div class="relative w-full xl:max-w-md">
      <i
        class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
      >
      </i>

      <input
        [(ngModel)]="search"
        type="text"
        placeholder="Search document..."
        class="w-full rounded-xl border border-slate-200 py-3 pl-11 pr-4 outline-none transition focus:border-[#88C273]"
      />
    </div>

    <!-- Filter -->

    <div class="flex flex-wrap gap-2">
      <button
        (click)="setCategory('All')"
        class="rounded-full px-4 py-2 text-sm transition"
        [ngClass]="
          selectedCategory === 'All'
            ? 'bg-[#88C273] text-white'
            : 'border border-slate-300 bg-white hover:bg-slate-50'
        "
      >
        All
      </button>

      <button
        (click)="setCategory('Invoice')"
        class="rounded-full px-4 py-2 text-sm transition"
        [ngClass]="
          selectedCategory === 'Invoice'
            ? 'bg-[#88C273] text-white'
            : 'border border-slate-300 bg-white hover:bg-slate-50'
        "
      >
        Invoice
      </button>

      <button
        (click)="setCategory('Receipt')"
        class="rounded-full px-4 py-2 text-sm transition"
        [ngClass]="
          selectedCategory === 'Receipt'
            ? 'bg-[#88C273] text-white'
            : 'border border-slate-300 bg-white hover:bg-slate-50'
        "
      >
        Receipt
      </button>

      <button
        (click)="setCategory('Warranty')"
        class="rounded-full px-4 py-2 text-sm transition"
        [ngClass]="
          selectedCategory === 'Warranty'
            ? 'bg-[#88C273] text-white'
            : 'border border-slate-300 bg-white hover:bg-slate-50'
        "
      >
        Warranty
      </button>

      <button
        (click)="setCategory('Insurance')"
        class="rounded-full px-4 py-2 text-sm transition"
        [ngClass]="
          selectedCategory === 'Insurance'
            ? 'bg-[#88C273] text-white'
            : 'border border-slate-300 bg-white hover:bg-slate-50'
        "
      >
        Insurance
      </button>
    </div>
  </div>

  <!-- ================= Empty ================= -->

  <div
    *ngIf="filteredDocuments.length === 0"
    class="rounded-2xl border-2 border-dashed border-slate-300 bg-white py-20 text-center"
  >
    <div
      class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-slate-100"
    >
      <i class="fa-regular fa-folder-open text-4xl text-slate-400"> </i>
    </div>

    <h3 class="mt-6 text-xl font-semibold text-slate-800">
      No Documents Found
    </h3>

    <p class="mt-2 text-slate-500">
      Upload documents or change your search criteria.
    </p>

    <button
      (click)="onUpload()"
      class="mt-6 rounded-xl bg-[#88C273] px-5 py-3 text-white hover:bg-[#79b464]"
    >
      Upload Document
    </button>
  </div>

  <!-- ================= List ================= -->

  <div
    *ngIf="filteredDocuments.length"
    class="grid gap-5 md:grid-cols-2 xl:grid-cols-3"
  >
    <div
      *ngFor="let item of filteredDocuments; trackBy: trackById"
      class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:border-[#88C273] hover:shadow-lg"
    >
      <!-- Icon -->

      <div
        class="flex h-14 w-14 items-center justify-center rounded-xl bg-slate-100 text-2xl text-[#88C273]"
      >
        <i class="fa-solid" [ngClass]="getFileIcon(item.type)"> </i>
      </div>

      <!-- Name -->

      <h3 class="mt-5 truncate text-lg font-semibold text-slate-800">
        {{ item.name }}
      </h3>

      <!-- Category -->

      <span
        class="mt-3 inline-flex rounded-full bg-green-50 px-3 py-1 text-xs font-semibold text-[#88C273]"
      >
        {{ item.category }}
      </span>

      <!-- Info -->

      <div class="mt-5 space-y-3 text-sm text-slate-500">
        <div class="flex justify-between">
          <span>Size</span>

          <span>{{ item.size }}</span>
        </div>

        <div class="flex justify-between">
          <span>Uploaded</span>

          <span>{{ item.uploadedAt }}</span>
        </div>
      </div>

      <!-- Actions -->

      <div class="mt-6 flex gap-2">
        <button
          (click)="onPreview(item)"
          class="flex-1 rounded-lg border border-slate-300 py-2 text-sm font-medium hover:bg-slate-50"
        >
          <i class="fa-regular fa-eye mr-2"></i>

          Preview
        </button>

        <button
          (click)="onDownload(item)"
          class="flex-1 rounded-lg bg-[#374870] py-2 text-sm font-medium text-white hover:bg-[#2f4066]"
        >
          <i class="fa-solid fa-download mr-2"></i>

          Download
        </button>
      </div>
    </div>
  </div>
</div>
