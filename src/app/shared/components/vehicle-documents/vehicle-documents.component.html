<div class="space-y-6">
  <!-- ================= Header Section ================= -->
  <div
    class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <h2
        class="text-base sm:text-lg lg:text-xl font-black text-slate-900 uppercase tracking-wide flex items-center gap-2"
      >
        <!-- Icon 20x20 (ห้ามเกิน 24x24) -->
        <i-lucide
          name="files"
          class="h-5 w-5 text-slate-700 flex-shrink-0"
        ></i-lucide>
        Documents Management
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 font-medium mt-1">
        คลังจัดการเอกสารทั้งหมด เช่น ใบเสร็จ ใบรับประกัน และเอกสารประจำรถ
      </p>
    </div>

    <!-- PRIMARY ACTION -->
    <button
      (click)="onUpload()"
      class="inline-flex items-center justify-center gap-2 px-4 py-2.5 sm:px-5 sm:py-3 bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-extrabold rounded-xl transition-all shadow-xs active:scale-95 flex-shrink-0 cursor-pointer"
    >
      <!-- Icon 18x18 -->
      <i-lucide name="upload" class="h-[18px] w-[18px]"></i-lucide>
      <span>อัปโหลดเอกสาร</span>
    </button>
  </div>

  <!-- ================= Search & Filter Bar (Option 2 - Soft Tone) ================= -->
  <div
    class="space-y-3 bg-white p-3.5 sm:p-4 rounded-xl border border-slate-200/80 shadow-xs"
  >
    <!-- Search Input Bar -->
    <div class="relative w-full">
      <i-lucide
        name="search"
        class="absolute left-1.5 top-1/2 -translate-y-1/2 h-[18px] w-[18px] text-slate-400 pointer-events-none"
      ></i-lucide>
      <input
        [(ngModel)]="search"
        type="text"
        placeholder="ค้นหาชื่อเอกสาร..."
        class="w-full bg-slate-50 border border-slate-200/80 rounded-xl py-2 pl-10 pr-4 text-xs sm:text-sm font-semibold text-slate-800 placeholder-slate-400 outline-none transition focus:border-slate-300 focus:bg-white"
      />
    </div>

    <!-- FILTER PILLS (Soft Tone & Clean Border) -->
    <div
      class="flex items-center gap-1.5 overflow-x-auto pt-2.5 no-scrollbar border-t border-slate-100"
    >
      <button
        *ngFor="let cat of categories"
        (click)="setCategory(cat)"
        class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all border whitespace-nowrap cursor-pointer flex-shrink-0"
        [ngClass]="
          selectedCategory === cat
            ? 'bg-slate-100 border-slate-300/80 text-slate-800 shadow-2xs'
            : 'bg-transparent border-transparent text-slate-400 hover:text-slate-700 hover:bg-slate-50'
        "
      >
        {{ cat === "All" ? "ทั้งหมด" : cat }}
      </button>
    </div>
  </div>

  <!-- ================= Document Grid List ================= -->
  <ng-container *ngIf="filteredDocuments.length > 0; else emptyState">
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <div
        *ngFor="let item of filteredDocuments; trackBy: trackById"
        class="bg-white rounded-xl border border-slate-200/80 p-4 sm:p-5 shadow-xs hover:border-slate-300 hover:shadow-sm transition-all flex flex-col justify-between space-y-4 group min-w-0"
      >
        <!-- Top Info: Icon + Name + Category -->
        <div class="space-y-3">
          <div class="flex items-start justify-between gap-3">
            <div
              class="w-10 h-10 sm:w-11 sm:h-11 rounded-lg flex items-center justify-center flex-shrink-0 border"
              [ngClass]="getFileIconColorClass(item.type)"
            >
              <!-- Max Size Limit: 24x24px (h-6 w-6) -->
              <i-lucide
                [name]="getLucideIcon(item.type)"
                class="h-5 w-5 sm:h-6 sm:w-6"
              ></i-lucide>
            </div>

            <span
              class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-extrabold uppercase tracking-wider border"
              [ngClass]="getCategoryBadgeClass(item.category)"
            >
              {{ item.category }}
            </span>
          </div>

          <div class="min-w-0">
            <h3
              class="text-sm sm:text-base font-extrabold text-slate-800 truncate group-hover:text-slate-900 transition-colors"
              [title]="item.name"
            >
              {{ item.name }}
            </h3>
            <p
              class="text-xs sm:text-sm font-medium text-slate-500 mt-1 truncate"
              *ngIf="item.description"
            >
              {{ item.description }}
            </p>
          </div>
        </div>

        <!-- Meta Details -->
        <div
          class="pt-3 border-t border-slate-100 text-xs sm:text-sm text-slate-500 font-medium space-y-1.5"
        >
          <div class="flex justify-between items-center">
            <span class="text-slate-400">ขนาดไฟล์:</span>
            <span class="font-bold text-slate-700">{{ item.size || "-" }}</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-slate-400">วันที่อัปโหลด:</span>
            <span class="font-bold text-slate-700">{{
              item.uploadedAt || "-"
            }}</span>
          </div>
        </div>

        <!-- CARD ACTIONS -->
        <div class="flex items-center gap-2 pt-1">
          <!-- Preview Button -->
          <button
            (click)="onPreview(item)"
            class="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200/80 rounded-lg text-xs sm:text-sm font-bold transition-colors cursor-pointer"
          >
            <!-- Icon 16x16 -->
            <i-lucide name="eye" class="h-4 w-4 text-slate-500"></i-lucide>
            <span>ดู</span>
          </button>

          <!-- Download Button -->
          <button
            (click)="onDownload(item)"
            class="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200/80 text-slate-800 rounded-lg text-xs sm:text-sm font-bold transition-colors cursor-pointer"
          >
            <!-- Icon 16x16 -->
            <i-lucide name="download" class="h-4 w-4 text-slate-600"></i-lucide>
            <span>โหลด</span>
          </button>

          <!-- Delete Button -->
          <button
            (click)="onDelete(item)"
            title="ลบเอกสาร"
            class="p-2 hover:bg-rose-50 text-slate-400 hover:text-rose-600 rounded-lg border border-transparent hover:border-rose-100 transition-colors cursor-pointer"
          >
            <!-- Icon 16x16 -->
            <i-lucide name="trash-2" class="h-4 w-4"></i-lucide>
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- ================= Empty State ================= -->
  <ng-template #emptyState>
    <div
      class="bg-white rounded-xl border border-slate-200/80 p-12 lg:p-16 text-center space-y-4"
    >
      <div
        class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto"
      >
        <!-- Max Size Limit: 24x24px (h-6 w-6) -->
        <i-lucide name="folder-open" class="h-6 w-6"></i-lucide>
      </div>
      <div>
        <h4 class="text-base sm:text-lg font-bold text-slate-800">
          ไม่พบเอกสารในระบบ
        </h4>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">
          ลองเปลี่ยนคำค้นหา หรืออัปโหลดเอกสารใหม่เข้าสู่ระบบ
        </p>
      </div>
    </div>
  </ng-template>
</div>
