<div class="pointer-events-none fixed inset-x-3 top-3 z-[10050] flex max-w-md flex-col gap-2 sm:left-auto sm:right-5 sm:top-5 sm:w-full" aria-live="polite" aria-atomic="true">
  <article
    *ngFor="let toast of toasts$ | async; trackBy: trackByToastId"
    class="pointer-events-auto flex items-start gap-3 rounded-2xl border bg-white p-3.5 shadow-xl ring-1 ring-slate-900/5 animate-fade-down"
    [ngClass]="{
      'border-emerald-200': toast.type === 'success',
      'border-rose-200': toast.type === 'error',
      'border-amber-200': toast.type === 'warning',
      'border-sky-200': toast.type === 'info'
    }"
    role="status"
  >
    <span
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl text-sm font-bold"
      [ngClass]="{
        'bg-emerald-100 text-emerald-700': toast.type === 'success',
        'bg-rose-100 text-rose-700': toast.type === 'error',
        'bg-amber-100 text-amber-700': toast.type === 'warning',
        'bg-sky-100 text-sky-700': toast.type === 'info'
      }"
    >{{ icon(toast.type) }}</span>
    <div class="min-w-0 flex-1 pt-0.5">
      <p class="text-sm font-bold text-slate-800">{{ toast.title }}</p>
      <p class="mt-0.5 break-words text-sm leading-5 text-slate-600">{{ toast.message }}</p>
    </div>
    <button
      type="button"
      (click)="dismiss(toast)"
      class="-mr-1 -mt-1 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg text-xl leading-none text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"
      aria-label="ปิดการแจ้งเตือน"
    >×</button>
  </article>
</div>
