<section class="product-page">
  <div class="container">

    <div class="layout">
      <aside class="filter-panel">
        <app-product-filter
          class="sticky-filter"
          [loading]="isLoading"
          [initialFilters]="filters"
          [initialCategorySlug]="categorySlug"
          [initialBrandCode]="brandCode"
          (onSearchChange)="onFilterChange($event)">
        </app-product-filter>
      </aside>

      <main class="content-area">

        <div class="page-header">

          <div class="header-left">
            <h2 class="page-title">
              รายการอะไหล่
            </h2>
            <p class="page-subtitle">
              <span *ngIf="!isLoading">{{ totalRecord | number }} รายการทั้งหมด</span>
              <span *ngIf="isLoading">กำลังโหลดรายการสินค้า...</span>
            </p>
          </div>

          <div class="header-right">

            <div class="sort-wrapper" [formGroup]="form">
              <label class="sort-label">เรียงตาม</label>

              <custom-select
                formControlName="sortBy"
                placeholder="เลือกการเรียงลำดับ">

                <custom-option value="latest">ล่าสุด</custom-option>
                <custom-option value="name_asc">ชื่อ A → Z</custom-option>
                <custom-option value="name_desc">ชื่อ Z → A</custom-option>
                <custom-option value="brand_asc">แบรนด์ A → Z</custom-option>
                <custom-option value="stock_desc">สต็อกมาก →
                  น้อย</custom-option>

              </custom-select>
            </div>

            <button
              type="button"
              class="primary-btn"
              (click)="onAddProduct()">

              <span class="btn-icon">+</span>
              เพิ่มสินค้า

            </button>

          </div>

        </div>

        <div *ngIf="isLoading" class="loading-state">
          <div class="loading-spinner"></div>
          <span>กำลังโหลดสินค้า</span>
        </div>

        <div *ngIf="!isLoading && errorMessage" class="error-state">
          <p>{{ errorMessage }}</p>
          <button type="button" class="retry-btn" (click)="retry()">ลองใหม่</button>
        </div>

        <div
          *ngIf="!isLoading && !errorMessage && productList.products.length > 0"
          class="product-grid">

          <app-product-card
            *ngFor="let product of productList.products; trackBy: trackByProduct"
            [product]="product"
            (clicked)="onClick($event)">
          </app-product-card>

        </div>

        <div
          *ngIf="!isLoading && !errorMessage && productList.products.length === 0"
          class="empty-state">
          <div class="empty-icon">⌕</div>
          <p>ไม่พบสินค้าที่ตรงกับเงื่อนไข</p>
          <small>ลองเปลี่ยนคำค้นหาหรือปรับตัวกรอง แล้วค้นหาอีกครั้ง</small>
        </div>

        <div class="pagination-wrapper">
          <app-pagination
            aligns="end"
            [paginationOption]="paginationOption"
            [currentPage]="pageIndex"
            [recordPerPage]="pageSize"
            (changePage)="onPageChange($event)"
            [totalRecord]="totalRecord">
          </app-pagination>
        </div>

      </main>

    </div>
  </div>
  <button
    class="fab-add"
    (click)="onAddProduct()">

    +

  </button>
</section>
