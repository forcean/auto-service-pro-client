<section class="product-page">
  <div class="container">

    <div class="layout">
      <aside class="filter-panel">
        <app-product-filter
          class="sticky-filter"
          (onSearchChange)="onFilterChange($event)">
        </app-product-filter>
      </aside>

      <main class="content-area">

        <div class="page-header">

          <div class="header-left">
            <h2 class="page-title">
              รายการอะไหล่
            </h2>
            <p class="page-subtitle">
              {{ productList?.products?.length || 0 }} รายการทั้งหมด
            </p>
          </div>

          <div class="header-right">

            <div class="sort-wrapper" [formGroup]="form">
              <label class="sort-label">เรียงตาม</label>

              <custom-select
                formControlName="sortBy"
                placeholder="เลือกการเรียงลำดับ">

                <custom-option value="latest">ล่าสุด</custom-option>
                <custom-option value="name_asc">ชื่อ A → Z</custom-option>
                <custom-option value="name_desc">ชื่อ Z → A</custom-option>
                <custom-option value="brand_asc">แบรนด์ A → Z</custom-option>
                <custom-option value="stock_desc">สต็อกมาก →
                  น้อย</custom-option>

              </custom-select>
            </div>

            <button
              type="button"
              class="primary-btn"
              (click)="onAddProduct()">

              <span class="btn-icon">+</span>
              เพิ่มสินค้า

            </button>

          </div>

        </div>

        <div
          *ngIf="productList?.products?.length; else emptyState"
          class="product-grid">

          <app-product-card
            *ngFor="let product of productList.products"
            [product]="product"
            (clicked)="onClick($event)">
          </app-product-card>

        </div>

        <ng-template #emptyState>
          <div class="empty-state">
            ไม่พบสินค้า
          </div>
        </ng-template>

        <div class="pagination-wrapper">
          <app-pagination
            aligns="end"
            [paginationOption]="paginationOption"
            [currentPage]="pageIndex"
            [recordPerPage]="pageSize"
            (changePage)="onPageChange($event)"
            [totalRecord]="10">
          </app-pagination>
        </div>

      </main>

    </div>
  </div>
  <button
    class="fab-add"
    (click)="onAddProduct()">

    +

  </button>
</section>
