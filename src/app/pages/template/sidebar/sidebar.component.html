<nav class="sidebar-menu h-full w-full" [class.is-mini]="isMinibar" aria-label="เมนูหลัก">
  <ul class="space-y-1 p-3" role="list">
    <li *ngFor="let menu of menus.menus; trackBy: trackByMenuKey">
      <button
        type="button"
        class="menu-trigger group"
        [class.is-active]="isActiveParentMenu(menu)"
        [class.is-expanded]="isMenuExpanded(menu)"
        [attr.aria-expanded]="menu.children.length ? isMenuExpanded(menu) : null"
        [attr.aria-current]="isActiveParentMenu(menu) ? 'page' : null"
        [attr.title]="isMinibar ? menu.displayName : null"
        (click)="toggleMenu(menu)"
      >
        <span class="menu-icon" aria-hidden="true">
          <img [src]="'assets/img/menu' + menu.icon" alt="" />
        </span>

        <span *ngIf="!isMinibar" class="menu-label">{{ menu.displayName }}</span>

        <svg *ngIf="menu.children.length && !isMinibar" class="menu-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="m7 5 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <div *ngIf="menu.children.length && isMenuExpanded(menu)" class="submenu-panel">
        <button
          *ngFor="let child of menu.children; trackBy: trackByMenuKey"
          type="button"
          class="submenu-trigger"
          [class.is-active]="isActiveMenu(child.endpoint)"
          [attr.aria-current]="isActiveMenu(child.endpoint) ? 'page' : null"
          (click)="navigate(child.endpoint)"
        >
          <span class="submenu-indicator" aria-hidden="true"></span>
          <span>{{ child.displayName }}</span>
        </button>
      </div>
    </li>
  </ul>
</nav>
