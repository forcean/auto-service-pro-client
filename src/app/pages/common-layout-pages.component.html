<div
  class="app-shell flex h-screen overflow-hidden bg-gradient-to-b from-[#f8fafc] to-slate-100">
  <div
    *ngIf="isSidebarOverlayOpen"
    class="sidebar-backdrop fixed inset-0 z-40 bg-slate-950/45 backdrop-blur-[1px]"
    (click)="closeSidebar()"
  ></div>
  <aside
    class="app-sidebar fixed left-0 top-0 z-50 flex h-full flex-col border-r border-slate-200/80 bg-white"
    [class.is-mobile]="isUseOffcanvas"
    [class.is-open]="!isMinibar">

    <div class="flex min-h-[4.5rem] items-center border-b border-slate-100 px-4">
      <img src="assets/img/logo/logo.new.svg"
        class="h-8 w-40 object-contain object-left" />
      <button
        type="button"
        class="ml-auto inline-flex h-9 w-9 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-900"
        (click)="closeSidebar()"
        aria-label="ปิดเมนู"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto px-1.5 py-3 scrollable-items">
      <app-sidebar
        [isMinibar]="isMinibar"
        [closeOnNavigate]="true"
        (miniBarToggled)="onSidebarToggled($event)">
      </app-sidebar>
    </div>

  </aside>

  <div class="application-content flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-header
      class="sticky top-0 z-20 bg-white shadow-sm"
      [isMinimal]="isMinibar"
      (miniBarToggled)="onSidebarToggled($event)">
    </app-header>

    <main #mainContent class="main-content flex-1 overflow-y-auto scrollable-items">
      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>
  </div>
</div>
